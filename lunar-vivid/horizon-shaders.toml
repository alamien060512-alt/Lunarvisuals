schema = 1
id = "lunar_vivid"
name = "Lunar Vivid"
version = "0.1.0"
api = "0.1"
description = "A vivid, stylized look: saturated colour, warm sun against cool shadows, bright turquoise water, soft haze and bloom."
authors = ["Lunarvisuals"]
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "Atmosphere"

[material]
file = "material.wgsl"
name = "Surfaces and water"

[reflection]
option = "water_reflections"

[[post]]
file = "post/ssao.wgsl"
name = "Ambient occlusion"

[[post]]
file = "post/fog.wgsl"
name = "Aerial haze"

[[post]]
file = "post/godrays.wgsl"
name = "God rays"

[[post]]
file = "post/bloom.wgsl"
name = "Bloom"

[[post]]
file = "post/grade.wgsl"
name = "Filmic grade"

[[options]]
id = "sun_strength"
name = "Sunlight"
type = "float"
default = 1.15
min = 0.2
max = 2.0
step = 0.1

[[options]]
id = "ambient_strength"
name = "Sky light"
type = "float"
default = 1.25
min = 0.2
max = 2.0
step = 0.1

[[options]]
id = "block_light"
name = "Torch light"
type = "float"
default = 1.0
min = 0.2
max = 2.0
step = 0.1

[[options]]
id = "water_waves"
name = "Water waves"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "water_clarity"
name = "Water clarity"
type = "float"
default = 0.7
min = 0.0
max = 1.0
step = 0.1

[[options]]
id = "water_reflections"
name = "Water reflections"
type = "bool"
default = true

[[options]]
id = "ao_strength"
name = "Ambient occlusion"
type = "float"
default = 0.6
min = 0.0
max = 1.5
step = 0.1

[[options]]
id = "ao_radius"
name = "AO radius"
type = "float"
default = 1.4
min = 0.4
max = 3.0
step = 0.2

[[options]]
id = "fog_density"
name = "Distance haze"
type = "float"
default = 1.0
min = 0.0
max = 1.5
step = 0.1

[[options]]
id = "ground_mist"
name = "Ground mist"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "god_rays"
name = "God rays"
type = "float"
default = 0.35
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "bloom"
name = "Bloom"
type = "float"
default = 0.45
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "exposure"
name = "Exposure"
type = "float"
default = 1.0
min = 0.6
max = 1.6
step = 0.05

[[options]]
id = "saturation"
name = "Saturation"
type = "float"
default = 1.3
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "contrast"
name = "Contrast"
type = "float"
default = 1.05
min = 0.8
max = 1.5
step = 0.05

[[options]]
id = "vignette"
name = "Vignette"
type = "bool"
default = true

[[options]]
id = "film_grain"
name = "Film grain"
type = "float"
default = 0.0
min = 0.0
max = 0.06
step = 0.005

[[options]]
id = "lens_dispersion"
name = "Lens dispersion"
type = "bool"
default = false

[budget]
gpu_ms = 4.0
