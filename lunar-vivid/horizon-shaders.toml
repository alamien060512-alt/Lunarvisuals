schema = 1
id = "lunar_vivid"
name = "Lunar Vivid"
version = "0.1.0"
api = "0.1"
description = "A vivid, stylized look: saturated colour, warm sun against cool shadows, bright turquoise water, soft haze and bloom."
authors = ["Lunarvisuals"]
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "Atmosphere"

[material]
file = "material.wgsl"
name = "Surfaces and water"

[reflection]
option = "water_reflections"

[[post]]
file = "post/finish.wgsl"
name = "Haze, bloom, grade"

[[options]]
id = "sun_strength"
name = "Sunlight"
type = "float"
default = 1.0
min = 0.2
max = 2.0
step = 0.1

[[options]]
id = "ambient_strength"
name = "Sky light"
type = "float"
default = 1.0
min = 0.2
max = 2.0
step = 0.1

[[options]]
id = "block_light"
name = "Torch light"
type = "float"
default = 1.0
min = 0.2
max = 2.0
step = 0.1

[[options]]
id = "water_waves"
name = "Water waves"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "water_clarity"
name = "Water clarity"
type = "float"
default = 0.7
min = 0.0
max = 1.0
step = 0.1

[[options]]
id = "water_reflections"
name = "Water reflections"
type = "bool"
default = true

[[options]]
id = "fog_density"
name = "Distance haze"
type = "float"
default = 0.7
min = 0.0
max = 1.5
step = 0.1

[[options]]
id = "ground_mist"
name = "Ground mist"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "bloom"
name = "Bloom"
type = "float"
default = 0.25
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "exposure"
name = "Exposure"
type = "float"
default = 1.0
min = 0.6
max = 1.6
step = 0.05

[[options]]
id = "saturation"
name = "Saturation"
type = "float"
default = 1.2
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "contrast"
name = "Contrast"
type = "float"
default = 1.05
min = 0.8
max = 1.5
step = 0.05

[[options]]
id = "vignette"
name = "Vignette"
type = "bool"
default = true

[budget]
gpu_ms = 2.0
